<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <link rel="stylesheet" href="./module3.css" />
</head>
<body data-page="login">
<div class="auth-shell">
    <section class="auth-side scenic-card">
        <div class="eyebrow portal-eyebrow">Secure Access</div>
        <h1>Log in to continue</h1>
        <p>
            This page enforces the PBI rules for authenticated sessions, role-based access, and contributor gating.
        </p>
        <div class="auth-side-links">
            <a href="./index.html">Back to portal</a>
            <a href="./register.html">Create a new account</a>
        </div>
    </section>

    <section class="auth-card scenic-card">
        <div class="section-head">
            <div>
                <h2>Member Login</h2>
                <p>Use your registered email address and password.</p>
            </div>
        </div>

        <form id="loginForm" class="form-stack">
            <div class="field">
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email" placeholder="name@example.com" autocomplete="email" />
            </div>

            <div class="field">
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" placeholder="Enter your password" autocomplete="current-password" />
            </div>

            <button type="submit" class="btn btn-primary auth-submit">Log In</button>
        </form>

        <div class="inline-note">
            Need a new account? <a href="./register.html">Register here</a>.
        </div>
    </section>
</div>

<div id="toast" class="toast"></div>

<script src="./access.js"></script>
</body>
</html>
